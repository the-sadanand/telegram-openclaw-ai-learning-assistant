name: Node.js checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check app.js
          node --check cli.js
          for file in lib/*.js; do
            node --check "$file"
          done
